<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Holy Star POS — Super-Admin" />
  <title>Holy Star — Admin</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=3.0" />
  <style>
    body.sa-body {
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
    }

    .sa-header {
      background: #0f172a;
      color: #ffffff;
      height: 56px;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .sa-brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-weight: 800;
      font-size: 0.98rem;
    }

    .sa-shield {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .sa-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sa-icon-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.38rem 0.65rem;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .sa-icon-btn:hover {
      background: #334155;
    }

    .sa-icon-btn.primary {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }

    .sa-icon-btn.gold {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #0f172a;
    }

    .sa-main {
      max-width: 1020px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* 4 Simple Top Stat Cards */
    .sa-stats-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 640px) {
      .sa-stats-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .sa-stat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sa-stat-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
    }

    .sa-stat-val {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 0.15rem;
      color: #0f172a;
    }

    .sa-stat-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      background: #f1f5f9;
    }

    /* Toolbar: Filters + Search */
    .sa-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .sa-filters {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .sa-filter-pill {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .sa-filter-pill.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* Compact Store List Rows/Cards */
    .sa-store-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .sa-store-row {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0.75rem 0.95rem;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1.1fr auto;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      transition: border-color 0.15s ease;
    }

    .sa-store-row:hover {
      border-color: #cbd5e1;
    }

    @media (max-width: 720px) {
      .sa-store-row {
        grid-template-columns: 1fr auto;
        gap: 0.55rem;
      }
      .sa-store-metrics,
      .sa-store-badges {
        grid-column: 1 / -1;
      }
    }

    .sa-store-id-tag {
      font-family: monospace;
      font-size: 0.72rem;
      font-weight: 900;
      background: #0f172a;
      color: #fbbf24;
      padding: 0.12rem 0.4rem;
      border-radius: 5px;
    }

    .sa-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .sa-badge-green { background: #dcfce7; color: #15803d; }
    .sa-badge-red { background: #fee2e2; color: #b91c1c; }
    .sa-badge-amber { background: #fef3c7; color: #b45309; }
    .sa-badge-slate { background: #f1f5f9; color: #475569; }

    /* Plan Picker Buttons inside + Token Modal */
    .sa-plan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .sa-plan-btn {
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 10px;
      padding: 0.65rem 0.4rem;
      text-align: center;
      font-weight: 800;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sa-plan-btn.active {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #92400e;
    }

    .sa-token-box {
      background: #0f172a;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 0.9rem;
      text-align: center;
      color: #ffffff;
      margin: 0.75rem 0;
    }

    .sa-token-code {
      font-family: 'Courier New', monospace;
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #fbbf24;
      margin: 0.25rem 0;
      user-select: all;
    }
  </style>
</head>
<body class="sa-body">

  <!-- 1. SUPER-ADMIN LOGIN GATE -->
  <div id="sa-login-overlay" class="auth-overlay">
    <div class="auth-card" style="max-width:380px;">
      <div class="auth-brand-header" style="padding:1.25rem;">
        <div class="auth-logo-circle" style="background:#f59e0b; color:#0f172a;">🛡️</div>
        <h2 style="font-size:1.15rem; font-weight:800;">Super-Admin</h2>
      </div>
      <div class="auth-body" style="padding:1.25rem;">
        <form id="form-sa-login">
          <div class="form-group">
            <label class="form-label" for="sa-login-username">Username</label>
            <input type="text" id="sa-login-username" class="form-control" placeholder="holystar_admin" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label class="form-label" for="sa-login-password">Password</label>
            <input type="password" id="sa-login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" style="background:#0f172a;">
            Unlock
          </button>
        </form>
      </div>
      <div style="padding:0.65rem 1.25rem; background:#f8fafc; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; font-size:0.75rem;">
        <a href="index.html" style="color:#4f46e5; font-weight:700; text-decoration:none;">← Store POS</a>
        <span style="color:#94a3b8;">Admin</span>
      </div>
    </div>
  </div>

  <!-- 2. MINIMAL HEADER -->
  <header class="sa-header">
    <div class="sa-brand">
      <div class="sa-shield">🛡️</div>
      <span>Holy Star Admin</span>
      <span id="sa-last-refresh-text" style="font-size:0.7rem; color:#94a3b8; font-weight:600;">Synced</span>
    </div>

    <div class="sa-actions">
      <button type="button" id="btn-sa-sync-now" class="sa-icon-btn primary" title="Sync Global Stores">
        🔄 Sync
      </button>
      <button type="button" id="btn-sa-open-token-modal-blank" class="sa-icon-btn gold" title="Generate Token">
        + Token
      </button>
      <button type="button" id="btn-sa-open-manual-store" class="sa-icon-btn" title="Add Offline Store">
        + Store
      </button>
      <button type="button" id="btn-sa-open-settings" class="sa-icon-btn" title="Admin Settings">
        ⚙️
      </button>
      <a href="index.html" class="sa-icon-btn" title="Open POS">
        🏪 POS
      </a>
      <button type="button" id="btn-sa-logout" class="sa-icon-btn" style="color:#fca5a5;" title="Lock">
        🔒
      </button>
    </div>
  </header>

  <!-- 3. MAIN CONTENT -->
  <main class="sa-main">

    <!-- 4 SIMPLE TOP STAT CARDS: Stores, Active, Expired, Offline -->
    <div class="sa-stats-row">
      <div class="sa-stat-card">
        <div>
          <div class="sa-stat-label">Stores</div>
          <div id="kpi-total-stores" class="sa-stat-val">0</div>
        </div>
        <div class="sa-stat-icon">🏪</div>
      </div>

      <div class="sa-stat-card">
        <div>
          <div class="sa-stat-label">Active</div>
          <div id="kpi-active-subs" class="sa-stat-val" style="color:#10b981;">0</div>
        </div>
        <div class="sa-stat-icon" style="background:#dcfce7;">✅</div>
      </div>

      <div class="sa-stat-card">
        <div>
          <div class="sa-stat-label">Expired</div>
          <div id="kpi-expired-subs" class="sa-stat-val" style="color:#ef4444;">0</div>
        </div>
        <div class="sa-stat-icon" style="background:#fee2e2;">🔒</div>
      </div>

      <div class="sa-stat-card">
        <div>
          <div class="sa-stat-label">Offline</div>
          <div id="kpi-offline-pill" class="sa-stat-val" style="color:#f59e0b;">0</div>
        </div>
        <div class="sa-stat-icon" style="background:#fef3c7;">📡</div>
      </div>
    </div>

    <!-- FILTER PILLS & SEARCH -->
    <div class="sa-toolbar">
      <div class="sa-filters">
        <button type="button" class="sa-filter-pill active" data-sa-filter="ALL">All</button>
        <button type="button" class="sa-filter-pill" data-sa-filter="ACTIVE">Active</button>
        <button type="button" class="sa-filter-pill" data-sa-filter="EXPIRED">Expired</button>
        <button type="button" class="sa-filter-pill" data-sa-filter="OFFLINE">Offline</button>
      </div>

      <div style="flex:1; min-width:200px; max-width:300px;">
        <input type="search" id="sa-store-search-input" class="form-control" placeholder="🔍 Search store or phone..." style="padding:0.4rem 0.7rem; font-size:0.8rem;" />
      </div>
    </div>

    <!-- COMPACT STORE CARDS / ROWS -->
    <div id="sa-stores-list" class="sa-store-list">
      <!-- Populated by super-admin.js -->
    </div>

  </main>

  <!-- ====================================================================
       MODAL 1: COMPACT 1-CLICK "+ TOKEN" GENERATOR MODAL
       ==================================================================== -->
  <div id="modal-sa-token" class="modal-backdrop hidden">
    <div class="modal-card" style="max-width:400px;">
      <div class="modal-header">
        <h3 class="modal-title">🔑 Generate Unlock Token</h3>
        <button type="button" class="modal-close" data-close-sa-modal="modal-sa-token">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-sa-generate-token">
          <div style="display:grid; grid-template-columns: 2fr 1fr; gap:0.5rem;">
            <div class="form-group">
              <label class="form-label" for="sa-gen-store-id">Store ID *</label>
              <input type="text" id="sa-gen-store-id" class="form-control" placeholder="HS-4821" required style="text-transform:uppercase; font-family:monospace; font-weight:900;" />
            </div>
            <div class="form-group">
              <label class="form-label" for="sa-gen-issue-code">Issue #</label>
              <input type="text" id="sa-gen-issue-code" class="form-control" value="001" required style="font-family:monospace; font-weight:800;" />
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem;">
            <div class="form-group">
              <label class="form-label" for="sa-gen-store-name">Store Name</label>
              <input type="text" id="sa-gen-store-name" class="form-control" placeholder="Store Name" />
            </div>
            <div class="form-group">
              <label class="form-label" for="sa-gen-owner-phone">WhatsApp Phone</label>
              <input type="tel" id="sa-gen-owner-phone" class="form-control" placeholder="0244..." />
            </div>
          </div>
          <input type="hidden" id="sa-gen-owner-name" value="" />

          <label class="form-label">Select Duration</label>
          <div class="sa-plan-grid">
            <button type="button" class="sa-plan-btn" data-plan-days="7">7 Days</button>
            <button type="button" class="sa-plan-btn active" data-plan-days="30">30 Days</button>
            <button type="button" class="sa-plan-btn" data-plan-days="14">14 Days</button>
          </div>
          <input type="hidden" id="sa-gen-plan-select" value="30" />

          <!-- Instant Generated Token Display -->
          <div id="sa-generated-token-panel" class="sa-token-box">
            <div style="font-size:0.72rem; color:#94a3b8;">
              <span id="sa-out-store-label">Store</span> • <span id="sa-out-days-label">30</span> Days
            </div>
            <div id="sa-out-token-code" class="sa-token-code">--------</div>
            <div id="sa-out-expiry-preview" style="font-size:0.7rem; color:#34d399;"></div>
          </div>

          <div style="display:flex; flex-direction:column; gap:0.45rem;">
            <button type="button" id="btn-sa-send-token-whatsapp" class="btn btn-whatsapp btn-block" style="font-weight:800;">
              💬 Send to WhatsApp
            </button>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.45rem;">
              <button type="button" id="btn-sa-copy-token" class="btn btn-outline btn-sm">
                📋 Copy Token
              </button>
              <button type="submit" class="btn btn-primary btn-sm">
                🔄 Regenerate
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ====================================================================
       MODAL 2: ADD OFFLINE STORE
       ==================================================================== -->
  <div id="modal-sa-manual-store" class="modal-backdrop hidden">
    <div class="modal-card" style="max-width:400px;">
      <div class="modal-header">
        <h3 class="modal-title">+ Add Store</h3>
        <button type="button" class="modal-close" data-close-sa-modal="modal-sa-manual-store">✕</button>
      </div>
      <form id="form-sa-manual-store">
        <div class="modal-body">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
            <div class="form-group">
              <label class="form-label" for="sa-man-store-id">Store ID *</label>
              <input type="text" id="sa-man-store-id" class="form-control" placeholder="HS-4821" required style="text-transform:uppercase; font-family:monospace; font-weight:800;" />
            </div>
            <div class="form-group">
              <label class="form-label" for="sa-man-category">Category</label>
              <select id="sa-man-category" class="form-control">
                <option value="Provision & Mini-Mart">Provision</option>
                <option value="Boutique & Fashion">Boutique</option>
                <option value="Pharmacy/Over-the-Counter">Pharmacy</option>
                <option value="Cosmetics">Cosmetics</option>
                <option value="Electronics/Phone Shop">Electronics</option>
                <option value="Food/Restaurant">Food</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="sa-man-store-name">Store Name *</label>
            <input type="text" id="sa-man-store-name" class="form-control" placeholder="Store Name" required />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
            <div class="form-group">
              <label class="form-label" for="sa-man-owner-name">Owner Name *</label>
              <input type="text" id="sa-man-owner-name" class="form-control" placeholder="Owner" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="sa-man-owner-phone">Phone *</label>
              <input type="tel" id="sa-man-owner-phone" class="form-control" placeholder="0244..." required />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" data-close-sa-modal="modal-sa-manual-store">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Store</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ====================================================================
       MODAL 3: ADMIN SETTINGS
       ==================================================================== -->
  <div id="modal-sa-settings" class="modal-backdrop hidden">
    <div class="modal-card" style="max-width:420px;">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ Admin Settings</h3>
        <button type="button" class="modal-close" data-close-sa-modal="modal-sa-settings">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-sa-credentials" style="margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px solid var(--border);">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem;">
            <div class="form-group">
              <label class="form-label" for="sa-set-username">Admin Username</label>
              <input type="text" id="sa-set-username" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="sa-set-password">Admin Password</label>
              <input type="password" id="sa-set-password" class="form-control" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-sm">Save Credentials</button>
        </form>

        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button type="button" id="btn-sa-export-registry" class="btn btn-outline btn-sm">⬇️ Export JSON</button>
          <label class="btn btn-outline btn-sm" style="cursor:pointer; margin:0;">
            ⬆️ Import JSON
            <input type="file" id="input-sa-import-registry" accept=".json,application/json" style="display:none;" />
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="db.js?v=3.0"></script>
  <script src="super-admin.js?v=3.0"></script>
</body>
</html>
